name: Publish viewer to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; don't cancel a run that is already deploying.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Build index.html from src/
        run: python3 build.py

      - name: Check the committed index.html is up to date
        run: |
          if ! git diff --quiet -- index.html; then
            echo "::error file=index.html::index.html is out of date with src/. Run 'python3 build.py' and commit the result."
            git diff --stat -- index.html
            exit 1
          fi

      - name: Install test dependencies
        run: npm install --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html .nojekyll LICENSE _site/
          cp -r samples _site/samples

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
