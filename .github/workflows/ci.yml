name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR supersedes the run in progress for it.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Check the committed index.html is up to date with src/
        run: |
          python3 build.py
          if ! git diff --quiet -- index.html; then
            echo "::error file=index.html::index.html is out of date with src/. Run 'python3 build.py' and commit the result."
            git diff --stat -- index.html
            exit 1
          fi

      - name: Syntax-check JavaScript
        run: |
          for f in src/engine.js tests/*.js; do node --check "$f"; done
          node tests/lint.js index.html

      - name: Syntax-check Python
        run: python3 -m py_compile build.py tools/*.py tests/mockgw.py

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Install test dependencies
        run: npm install --no-audit --no-fund

      - name: Run tests
        run: npm test
