  'in': '[in_i]', '[in_i]': '[in_i]', 'cm': 'cm', 'f': '[degF]', '°f': '[degF]', '[degf]': '[degF]', 'c': 'Cel', '°c': 'Cel', 'cel': 'Cel', 'kg/m2': 'kg/m2', 'kg/m^2': 'kg/m2', 'ml/min/1.73m2': 'mL/min/{1.73_m2}', '{score}': '{score}', 'mg': 'mg' };
function qty(value, unit) {
  const q = { value: Number(value) }; if (unit) { q.unit = unit; const u = UCUM_MAP[String(unit).toLowerCase()]; if (u) { q.system = UCUM; q.code = u; } }
  return q;
}

async function pdfToLines(buf, file, report) {
  if (!deps.pdfjs) throw new Error('PDF library not loaded');
  const pdf = await deps.pdfjs.getDocument({ data: new Uint8Array(buf.slice(0)), isEvalSupported: false, disableFontFace: true, verbosity: 0 }).promise;
  const lines = []; const empty = [];
  for (let p = 1; p <= pdf.numPages; p++) {
    const page = await pdf.getPage(p); const tc = await page.getTextContent();
    const items = tc.items.filter(it => it.str && it.str.trim());
    if (!items.length) { empty.push(p); continue; }
    items.sort((a, b) => (b.transform[5] - a.transform[5]) || (a.transform[4] - b.transform[4]));
    const rows = [];
    for (const it of items) { const y = it.transform[5]; let r = rows.find(r => Math.abs(r.y - y) < 2.5); if (!r) { r = { y, items: [] }; rows.push(r); } r.items.push(it); }

    const gaps = rows.slice(1).map((r, i) => rows[i].y - r.y).filter(g => g > 0).sort((a, b) => a - b); const med = gaps.length ? gaps[Math.floor(gaps.length * 0.3)] : 12;
    let ln = 0, prevY = null;
    for (const r of rows) {
      if (prevY != null && prevY - r.y > med * 1.6) { const n = Math.min(2, Math.round((prevY - r.y) / med) - 1); for (let k = 0; k < n; k++) lines.push({ text: '', page: p, line: ++ln }); }
      prevY = r.y;
      r.items.sort((a, b) => a.transform[4] - b.transform[4]);
      let text = '', end = null;
      for (const it of r.items) {
        const x = it.transform[4]; const cw = it.width / Math.max(1, it.str.length) || Math.abs(it.transform[0]) * 0.5 || 4;
        if (end != null) { const gap = x - end; if (gap > cw * 1.2) text += ' '.repeat(Math.max(2, Math.min(40, Math.round(gap / cw)))); else if (gap > cw * 0.2 && !/\s$/.test(text) && !/^\s/.test(it.str)) text += ' '; }

async function loadSamples(names, log) {
  const fos = [];
  for (const n of names) { try { let r = await fetch('samples/' + n + (/\.(xml|hl7)$/i.test(n) ? '.txt' : '')); if (!r.ok && /\.(xml|hl7)$/i.test(n)) r = await fetch('samples/' + n); if (!r.ok) throw new Error(r.status); fos.push({ name: n, buf: await r.arrayBuffer() }); } catch (e) { if (log) log.textContent += 'Could not load ' + n + ' (' + e.message + ')\n'; } }

}

const IN_CLAUDE = !!window.claude; // false when the viewer is opened as an ordinary web page (e.g. GitHub Pages)
async function saveFile(filename, data) {
  if (!IN_CLAUDE) { try { const url = URL.createObjectURL(new Blob([data], { type: /\.csv$/.test(filename) ? 'text/csv' : 'application/json' })); const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 10000); status('Saved ' + filename); return true; } catch (e) { return false; } }
  try { const dl = await window.claude?.use?.('downloads'); if (dl) { await dl.save({ filename, data }); status('Saved ' + filename); return true; } } catch (e) { if (e && e.code === 'declined') { status('Save cancelled.'); return true; } status('Save failed: ' + (e && (e.message || e.code))); }
  return false;
}
function exportDialog() {
  const d = dialog('Export Structured Data', '<div class="help"><p><b>Format: HL7 FHIR R4 Bundle</b> (type <i>collection</i>, JSON). Every data element is its own FHIR resource (Observation, Condition, MedicationRequest, AllergyIntolerance, DocumentReference …) and carries a <i>source-reference</i> extension with the file name, page(s) and location it came from. One Provenance resource per source file records the file name, format and SHA-256 hash. A flat CSV (one row per data element) is offered for spreadsheets.</p></div>' +

}
async function doExport(d, kind) {
  const all = $('input[name=scope]:checked', d).value === 'all'; const key = all ? null : ui.pt;
  const opt = { includeUnstructured: $('#xun', d).checked, includeOther: $('#xot', d).checked };
  const p = PT(); const base = 'CPRS4CC_' + (all ? 'all_patients' : ((p && p.resource.name[0].family) || 'patient').replace(/[^A-Za-z0-9]/g, '')) + '_' + new Date().toISOString().slice(0, 10);
  const json = kind !== 'csv' ? JSON.stringify(E.exportBundle(key, opt), null, 1) : null; const data = kind === 'csv' ? E.exportCSV(key) : json;
  const msg = $('#xmsg', d), out = $('#xout', d);
  if (kind === 'copy') { try { await navigator.clipboard.writeText(data); msg.textContent = 'Copied ' + (data.length / 1024).toFixed(0) + ' KB of FHIR JSON to the clipboard.'; } catch (e) { out.hidden = false; out.value = data; out.select(); msg.textContent = 'Copy was blocked here. The JSON is selected below — press Ctrl+C / ⌘C.'; } return; }
  const ok = await saveFile(base + (kind === 'csv' ? '.csv' : '.json'), data);
  if (!ok) { out.hidden = false; out.value = data; out.select(); msg.textContent = 'File saving is not available in this view. The export is shown below — select and copy it.'; }
  else msg.textContent = 'Export prepared: ' + (data.length / 1024).toFixed(0) + ' KB.';
}

function helpDialog() {
  dialog('Data Formats', '<div class="help">' +
    '<h3>Internal and export format: HL7 FHIR R4 (US Core)</h3>' +
    '<p>Everything imported is restructured into FHIR R4 resources aligned with the US Core profiles, and exported as a FHIR Bundle. FHIR was chosen because it is the format US certified EHRs are required to expose (ONC Cures Act / USCDI APIs), so Epic, Oracle Health and the VA Lighthouse APIs already speak it and the export can be read back by them and by most health-data tools.</p>' +
    '<p>FHIR is also granular in exactly the way this viewer needs: each heart rate, lab result, problem, medication or report is its own resource. An Observation carries date/time, value, units (UCUM), reference range (low/high), interpretation flag (H, L, HH, LL, A), specimen, performing lab and comments. Clinical notes, consults, radiology and pathology reports are DocumentReferences with date, author, source facility, title and the text body. Panels are DiagnosticReports that point to their results.</p>' +
    '<h3>Source traceability</h3><p>Each resource carries one or more <i>source-reference</i> extensions (file, page(s), location in the file, original format, original resource id). Identical items found in several files are merged and keep every reference. The export adds a Provenance resource per file with its SHA-256 hash.</p>' +
    '<h3>Unmapped content</h3><p>Text that cannot be turned into a standard data element (cover sheets, handouts, narrative-only sections, unknown HL7 segments, image-only PDF pages) becomes a DocumentReference with category <i>unstructured-import</i>, keeping date/time when one is present, the text and its source reference. These appear on the Ext Data tab.</p>' +
    '<h3>Claude extraction for printouts</h3><p>PDF and text printouts can be read by Claude instead of the built-in rules (File › Import, Tools › Claude Extraction Settings). By default every identifier is first replaced in this browser: the patient’s name, <b>every date of any kind</b> (labs, vitals, medications, allergies, notes, imaging, pathology …), ID numbers, phone and fax numbers, emails, addresses, other people’s names and ages over 89. You review the exact text before it is sent. Claude returns structure and page/line pointers only; note and report text is copied from the original page, every returned value is checked against its cited line (items that do not match are rejected and kept as unmapped content), and the placeholders are replaced with the original values in this browser. Sending without substitution is offered only for an organization endpoint you mark as approved for patient information; inside claude.ai the page can reach Claude only through the viewer’s own account, which is not covered by a business associate agreement. Whether de-identified text meets HIPAA or VA requirements is a decision for your Privacy Officer.</p><h3>What the importers read</h3><p>FHIR R4 JSON / NDJSON / Bundles; HL7 C-CDA (results, vitals, problems, medications, allergies, immunizations, procedures, encounters, notes; note-type documents become a single document); HL7 v2 ORU (OBX numeric results, NTE comments, TX report text); PDF and text printouts using layout rules for VA CPRS/VistA, Blue Button and MyChart-style pages. Lab names from printouts (and local codes in other formats) are mapped to LOINC using a table of about 200 common results, including serum tumor markers, chosen by specimen (serum, blood, urine, arterial, venous); the printed name is always kept. See Help › LOINC Mapping Table. Printed times have no time zone, so the viewer’s local zone is assumed. Scanned PDFs without a text layer are flagged, not read (no OCR).</p></div>', [{ t: 'Close' }], { width: 720 });
}
